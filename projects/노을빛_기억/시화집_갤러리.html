      if (statusEl) {
        statusEl.textContent = secLabel;
        statusEl.title = secLabel;
      }
      highlightActiveTocItem();
    }

    // --------------------------------------------------------
    // 7. 시화 에피소드 로드 & 다면(1부/2부) 렌더링
    // --------------------------------------------------------
    function loadEpisode(index, spreadPart = 1) {
      if (index < 0 || index >= EPISODES.length) return;
      const isSameEpisode = (currentIndex === index && currentSectionId === null && currentIndex !== -1);
      currentIndex = index;
      currentSectionId = null;

      const data = EPISODES[currentIndex];
      const ovLeft = document.getElementById('dtpMatterOverlayLeft');
      const ovRight = document.getElementById('dtpMatterOverlayRight');
      if (ovLeft) ovLeft.style.display = 'none';
      if (ovRight) ovRight.style.display = 'none';

      const cfg = getNormalizedConfig(data);
      const flowResult = calculateTextFlowAndPages(data, cfg);
      const { textFlowMap, textFlowSplitMap, overflowFlags, requiredPages } = flowResult;
      const totalPages = Math.max(cfg.page_count || 2, requiredPages);
      const maxParts = Math.max(1, Math.ceil(totalPages / 2));

      currentSpreadPart = Math.max(1, Math.min(maxParts, spreadPart || 1));

      // 책 전체 구조상의 시작 페이지 번호 조회
      let baseStartPage = null;
      if (BOOK_STRUCTURE && Array.isArray(BOOK_STRUCTURE.sections)) {
        const matchSec = BOOK_STRUCTURE.sections.find(s => s.episode_no === data.ep);
        if (matchSec && matchSec.start_page) baseStartPage = matchSec.start_page;
      }

      // 상단 헤더 동기화 (숨김 메타 태그 안전 갱신)
      const elBadge = document.getElementById('poemBadge');
      if (elBadge) elBadge.innerText = data.ep;
      const elTitle = document.getElementById('poemTitle');
      if (elTitle) elTitle.innerText = data.title;
      const elMeta = document.getElementById('readerPageMeta');
      if (elMeta) {
        const pStart = baseStartPage ? baseStartPage + (currentSpreadPart - 1) * 2 : (currentSpreadPart - 1) * 2 + 1;
        const pEnd = pStart + 1;
        elMeta.innerText = totalPages > 2
          ? `(${totalPages}쪽 중 ${currentSpreadPart}부 · p.${pStart}~${pEnd})`
          : `(p.${pStart}~${pEnd})`;
      }

      // 다면(4P/6P) 스위치 버튼 노출 제어
      const switcher = document.getElementById('spreadPartSwitcher');
      const btnP1 = document.getElementById('btnSpreadPart1');
      const btnP2 = document.getElementById('btnSpreadPart2');
      const btnP3 = document.getElementById('btnSpreadPart3');
      if (switcher) {
        switcher.style.display = (maxParts > 1) ? 'inline-flex' : 'none';
        if (btnP1) btnP1.classList.toggle('active', currentSpreadPart === 1);
        if (btnP2) btnP2.classList.toggle('active', currentSpreadPart === 2);
        if (btnP3) {
          btnP3.style.display = (maxParts >= 3) ? 'inline-block' : 'none';
          btnP3.classList.toggle('active', currentSpreadPart === 3);
        }
      }

      // 좌/우 페이지 렌더링
      const leftPageIdx = (currentSpreadPart - 1) * 2;
      const rightPageIdx = leftPageIdx + 1;
      renderSinglePage('left', leftPageIdx, cfg, data, textFlowMap, overflowFlags, baseStartPage, textFlowSplitMap);
      renderSinglePage('right', rightPageIdx, cfg, data, textFlowMap, overflowFlags, baseStartPage, textFlowSplitMap);

      // 사이드바 및 하단 인디케이터 갱신
      document.getElementById('pageIndicator').innerText = `${currentIndex + 1} / ${EPISODES.length}`;
      const bPrev = document.getElementById('btnPrev');
      if (bPrev) bPrev.disabled = false;
      const bNext = document.getElementById('btnNext');
      if (bNext) bNext.disabled = false;

      const btnTurnPrev = document.getElementById('btnTurnPrev');
      if (btnTurnPrev) btnTurnPrev.disabled = false;
      const btnTurnNext = document.getElementById('btnTurnNext');
      if (btnTurnNext) btnTurnNext.disabled = false;

      const partSuffix = maxParts > 1 ? ` — ${currentSpreadPart}부 (${leftPageIdx + 1}·${rightPageIdx + 1}면)` : ' — 1·2면';
      document.getElementById('turnStatusLabel').textContent = `${data.ep} 「${data.title}」${partSuffix}`;

      // 같은 시 안에서 1부/2부만 전환할 때는 오디오를 끊지 않고 유지!
      if (!isSameEpisode) {
        setupEpisodeAudioAndVideo(data);
      }

      highlightActiveTocItem();
      adjustSpreadScale();
    }

    function switchGallerySpreadPart(partNum) {
      loadEpisode(currentIndex, partNum);
    }

    // --------------------------------------------------------
    // 8. 목차 렌더링 (시화 목록 모드 / 전권 구성 모드)
    // --------------------------------------------------------
    function setTocMode(mode) {
      tocMode = mode;
      document.getElementById('btnTocModePoems').classList.toggle('active', mode === 'poems');
      document.getElementById('btnTocModeFull').classList.toggle('active', mode === 'full');
      renderTOC();
    }

    function createPoemTocItem(item, index) {
      const div = document.createElement('div');
      const isActive = (currentSectionId === null && index === currentIndex);
      div.className = `toc-item ${isActive ? 'active' : ''}`;
      div.setAttribute('data-ep-idx', index);
      div.onclick = () => loadEpisode(index, 1);

      const hasA = Boolean(
        item.hasAudio || (item.hasRecite && item.recite) || (item.hasMusic && item.music) ||
        (item.hasVoice && item.voice) || (item.hasAiRecite && item.aiRecite) ||
        (item.hasSong && item.song) || item.audio || item.recite || item.music
      );
      const hasV = Boolean(
        item.hasVideo || (item.hasPoemVideo && item.poemVideo) ||
        (item.hasSongVideo && item.songVideo) || item.video || item.poemVideo || item.songVideo
      );

      const cfg = getNormalizedConfig(item);
      const pageCount = cfg.page_count || 2;
      const pageBadge = pageCount > 2 ? `<span class="page-span-tag">${pageCount}P</span>` : '';

      const badgesArr = [];
      if (hasA) badgesArr.push('<span class="media-badge badge-audio" title="오디오 수록">🎧</span>');
      if (hasV) badgesArr.push('<span class="media-badge badge-video" title="영상 수록">🎬</span>');

      div.innerHTML = `
        <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          <span class="ep-tag">${item.ep}</span>
          <span>${item.title}</span>
          ${pageBadge}
        </div>
        <div style="display:flex; gap:4px; align-items:center;">${badgesArr.join('')}</div>
      `;
      return div;
    }

    function renderTOC() {
      const box = document.getElementById('tocBox');
      if (!box) return;
      box.innerHTML = '';

      if (tocMode === 'full' && BOOK_STRUCTURE && Array.isArray(BOOK_STRUCTURE.sections)) {
        // 전권 구성 모드: 앞부속 / 본문 시화 / 뒷부속
        const groups = [
          { key: 'front_matter', label: '📘 앞부속 (표지·서문·차례)' },
          { key: 'body_matter', label: '📖 본문 시화' },
          { key: 'back_matter', label: '📙 뒷부속 (맺음말·판권·뒤표지)' }
        ];
        groups.forEach(g => {
          const secs = BOOK_STRUCTURE.sections.filter(s => s.group === g.key);
          if (secs.length === 0) return;
          const header = document.createElement('div');
          header.className = 'toc-group-label';
          header.textContent = g.label;
          box.appendChild(header);

          secs.forEach(sec => {
            if (sec.section_type === 'poem' && sec.episode_no) {
              const epIdx = EPISODES.findIndex(e => e.ep === sec.episode_no);
              if (epIdx !== -1) {
                box.appendChild(createPoemTocItem(EPISODES[epIdx], epIdx));
              }
            } else {
              const div = document.createElement('div');
              const isAct = (currentSectionId === sec.id);
              div.className = `toc-item ${isAct ? 'active' : ''}`;
              div.setAttribute('data-sec-id', sec.id);
              div.onclick = () => renderMatterSection(sec.id);
              div.innerHTML = `
                <div>
                  <span class="ep-tag">p.${sec.start_page}</span>
                  <span>${sec.title}</span>
                </div>
              `;
              box.appendChild(div);
            }
          });
        });
      } else {
        // 시화 작품 전용 모드
        EPISODES.forEach((item, index) => {
          box.appendChild(createPoemTocItem(item, index));
        });
      }
    }

    function highlightActiveTocItem() {
      const box = document.getElementById('tocBox');
      if (!box) return;
      box.querySelectorAll('.toc-item').forEach(el => {
        const epIdx = el.getAttribute('data-ep-idx');
        const secId = el.getAttribute('data-sec-id');
        let isActive = false;
        if (currentSectionId && secId === currentSectionId) isActive = true;
        else if (!currentSectionId && epIdx !== null && parseInt(epIdx, 10) === currentIndex) isActive = true;
        el.classList.toggle('active', isActive);
        if (isActive) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
    }

    // --------------------------------------------------------
    // 9. 네비게이션 (작품 단위 이동 & 펼침면 전권 연속 이동)
    // --------------------------------------------------------
    function navigatePrevWork() {
      if (currentSectionId !== null) {
        const frontMatterIds = ['cover', 'half_title', 'prologue', 'toc'];
        if (frontMatterIds.includes(currentSectionId)) {
          return;
        }
        if (EPISODES.length > 0) loadEpisode(EPISODES.length - 1, 1);
        return;
      }
      if (currentIndex > 0) {
        loadEpisode(currentIndex - 1, 1);
      } else {
        renderMatterSection('toc');
      }
    }

    function navigateNextWork() {
      if (currentSectionId !== null) {
        const frontMatterIds = ['cover', 'half_title', 'prologue', 'toc'];
        if (frontMatterIds.includes(currentSectionId)) {
          if (EPISODES.length > 0) loadEpisode(0, 1);
          return;
        }
        return;
      }
      if (currentIndex < EPISODES.length - 1) {
        loadEpisode(currentIndex + 1, 1);
      } else {
        renderMatterSection('epilogue');
      }
    }

    let isPageFlipping3D = false;

    function animatePageFlip3D(delta, onPageChange) {
      if (isPageFlipping3D) return;
      const spread = document.getElementById('bookSpreadContainer');
      const pageToFlip = delta > 0 ? document.getElementById('dtpPageRight') : document.getElementById('dtpPageLeft');
      if (!spread || !pageToFlip) {
        onPageChange();
        return;
      }

      isPageFlipping3D = true;

      // 1. 넘어가는 3D 잎사귀(Leaf) 생성
      const leaf = document.createElement('div');
      leaf.className = `flip-page-leaf ${delta > 0 ? 'flip-forward' : 'flip-backward'}`;

      // 2. 앞면 (현재 페이지 복제 — 글과 그림이 그대로 들림)
      const frontFace = document.createElement('div');
      frontFace.className = 'flip-face flip-front';
      const clonedContent = pageToFlip.cloneNode(true);
      clonedContent.removeAttribute('id');
      clonedContent.style.position = 'absolute';
      clonedContent.style.inset = '0';
      clonedContent.style.width = '100%';
      clonedContent.style.height = '100%';
      frontFace.appendChild(clonedContent);
      leaf.appendChild(frontFace);

      // 3. 뒷면 (은은한 한지 미색 질감과 책등 잔상)
      const backFace = document.createElement('div');
      backFace.className = 'flip-face flip-back';
      const spineShadow = document.createElement('div');
      spineShadow.className = 'flip-back-spine-shadow';
      const watermark = document.createElement('div');
      watermark.className = 'flip-back-watermark';
      watermark.textContent = '❦';
      backFace.appendChild(spineShadow);
      backFace.appendChild(watermark);
      leaf.appendChild(backFace);

      // 4. 바닥 페이지에 드리우는 동적 그림자
      const floorShadow = document.createElement('div');
      floorShadow.className = `flip-floor-shadow ${delta > 0 ? 'left-shadow' : 'right-shadow'}`;

      spread.appendChild(floorShadow);
      spread.appendChild(leaf);

      // 5. 회전의 중간 지점 (90도 수직, 260ms)에서 바닥 페이지 데이터 전환
      setTimeout(() => {
        try {
          onPageChange();
        } catch (e) {
          console.error('[PageFlip Error]', e);
        }
      }, 260);

      // 6. 180도 회전 완료 후 (530ms) 오버레이 청소 및 상태 잠금 해제
      setTimeout(() => {
        if (leaf.parentNode) leaf.parentNode.removeChild(leaf);
        if (floorShadow.parentNode) floorShadow.parentNode.removeChild(floorShadow);
        isPageFlipping3D = false;
      }, 530);
    }

    function navigateSpreadStep(delta) {
      if (isPageFlipping3D) return;

      const performNavigation = () => {
        // 1. 부속물 열람 중일 때
        if (currentSectionId !== null) {
          const frontMatterIds = ['cover', 'half_title', 'prologue', 'toc'];
          const backMatterIds = ['epilogue', 'colophon', 'back_cover'];

          if (frontMatterIds.includes(currentSectionId)) {
            const idx = frontMatterIds.indexOf(currentSectionId);
            if (delta > 0) {
              if (idx < frontMatterIds.length - 1) {
                renderMatterSection(frontMatterIds[idx + 1]);
              } else {
                // toc 다음은 본문 첫 시화(0)의 1면!
                if (EPISODES.length > 0) loadEpisode(0, 1);
              }
            } else {
              if (idx > 0) {
                renderMatterSection(frontMatterIds[idx - 1]);
              }
            }
            return;
          }

          if (backMatterIds.includes(currentSectionId)) {
            // epilogue와 colophon은 동일 펼침면(p.42~43)을 다룸
            if (delta > 0) {
              if (currentSectionId === 'epilogue' || currentSectionId === 'colophon') {
                renderMatterSection('back_cover');
              }
            } else {
              if (currentSectionId === 'back_cover') {
                renderMatterSection('epilogue');
              } else if (currentSectionId === 'epilogue' || currentSectionId === 'colophon') {
                // 뒷부속 이전은 본문 마지막 시화의 마지막 파트!
                if (EPISODES.length > 0) {
                  const lastIdx = EPISODES.length - 1;
                  const lastData = EPISODES[lastIdx];
                  const lastCfg = getNormalizedConfig(lastData);
                  const lastFlow = calculateTextFlowAndPages(lastData, lastCfg);
                  const lastTotal = Math.max(lastCfg.page_count || 2, lastFlow.requiredPages);
                  const lastMaxParts = Math.max(1, Math.ceil(lastTotal / 2));
                  loadEpisode(lastIdx, lastMaxParts);
                }
              }
            }
            return;
          }

          // 기타 섹션인 경우 전체 sections 배열 순회
          const secs = (BOOK_STRUCTURE && BOOK_STRUCTURE.sections) || [];
          const curSecIdx = secs.findIndex(s => s.id === currentSectionId);
          const nextSecIdx = curSecIdx + delta;
          if (nextSecIdx >= 0 && nextSecIdx < secs.length) {
            const target = secs[nextSecIdx];
            if (target.section_type === 'poem' && target.episode_no) {
              const epIdx = EPISODES.findIndex(e => e.ep === target.episode_no);
              if (epIdx !== -1) loadEpisode(epIdx, delta > 0 ? 1 : 99);
            } else {
              renderMatterSection(target.id);
            }
          }
          return;
        }

        // 2. 본문 시화 열람 중일 때
        const data = EPISODES[currentIndex];
        if (!data) return;
        const cfg = getNormalizedConfig(data);
        const flowResult = calculateTextFlowAndPages(data, cfg);
        const totalPages = Math.max(cfg.page_count || 2, flowResult.requiredPages);
        const maxParts = Math.max(1, Math.ceil(totalPages / 2));

        if (delta > 0) {
          if (currentSpreadPart < maxParts) {
            loadEpisode(currentIndex, currentSpreadPart + 1);
          } else if (currentIndex < EPISODES.length - 1) {
            loadEpisode(currentIndex + 1, 1);
          } else {
            // 본문 마지막 시화의 마지막 면에서 '다음 면'을 누르면 뒷부속(맺음말)으로 자연스럽게 진입!
            renderMatterSection('epilogue');
          }
        } else {
          if (currentSpreadPart > 1) {
            loadEpisode(currentIndex, currentSpreadPart - 1);
          } else if (currentIndex > 0) {
            const prevData = EPISODES[currentIndex - 1];
            const prevCfg = getNormalizedConfig(prevData);
            const prevFlow = calculateTextFlowAndPages(prevData, prevCfg);
            const prevTotal = Math.max(prevCfg.page_count || 2, prevFlow.requiredPages);
            const prevMaxParts = Math.max(1, Math.ceil(prevTotal / 2));
            loadEpisode(currentIndex - 1, prevMaxParts);
          } else {
            // 본문 첫 번째 시화의 1면에서 '이전 면'을 누르면 앞부속(차례)으로 자연스럽게 복귀!
            renderMatterSection('toc');
          }
        }
      };

      // 3D 책장 넘김 모션과 함께 실행!
      animatePageFlip3D(delta, performNavigation);
    }

    // --------------------------------------------------------
    // 10. 글자 크기 배율 조절 (조판 기준 상대 증감)
    // --------------------------------------------------------
    function updateFontTagUI() {
      const tag = document.getElementById('fontSizeTag');
      if (!tag) return;
      if (readerFontDeltaPt === 0) tag.textContent = '기본';
      else if (readerFontDeltaPt > 0) tag.textContent = `+${readerFontDeltaPt}pt`;
      else tag.textContent = `${readerFontDeltaPt}pt`;
    }

    function changeFontDelta(delta) {
      readerFontDeltaPt = Math.max(-3, Math.min(5, readerFontDeltaPt + delta));
      localStorage.setItem('storybook_reader_font_delta', readerFontDeltaPt);
      updateFontTagUI();
      if (currentSectionId === null) loadEpisode(currentIndex, currentSpreadPart);
    }

    function resetFontDelta() {
      readerFontDeltaPt = 0;
      localStorage.setItem('storybook_reader_font_delta', 0);
      updateFontTagUI();
      if (currentSectionId === null) loadEpisode(currentIndex, currentSpreadPart);
    }

    // --------------------------------------------------------
    // 11. 오디오(낭송/노래) & 비디오 플레이어 제어
    // --------------------------------------------------------
    let galleryAvailableVideos = { poem: null, song: null };

    function setupEpisodeAudioAndVideo(data) {
      const musicSec = document.getElementById('musicSection');
      const audioPlayer = document.getElementById('audioPlayer');
      const toggleGroup = document.getElementById('audioToggleGroup');

      if (musicSec) musicSec.style.display = 'none';
      if (audioPlayer) {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }

      const btnVoice = document.getElementById('btnPlayVoice');
      const btnAiRecite = document.getElementById('btnPlayAiRecite');
      const btnMusicRecite = document.getElementById('btnPlayMusicRecite');
      const btnMusic = document.getElementById('btnPlayMusic');

      const hasV = Boolean(data.voice || (data.hasVoice && data.voice) || (data.recite && (data.recite.includes('육성') || data.recite.endsWith('.webm'))));
      const hasMR = Boolean(data.musicRecite || (data.hasMusicRecite && data.musicRecite) || (data.recite && data.recite.includes('음악')));
      const hasAi = Boolean(data.aiRecite || (data.hasAiRecite && data.aiRecite) || (data.recite && !data.recite.includes('육성') && !data.recite.includes('음악')));
      const hasM = Boolean(data.song || data.music || (data.hasSong && data.song) || (data.hasMusic && data.music) || (data.audio && !data.audio.includes('낭송')));

      if (btnVoice) btnVoice.style.display = hasV ? 'inline-block' : 'none';
      if (btnAiRecite) btnAiRecite.style.display = hasAi ? 'inline-block' : 'none';
      if (btnMusicRecite) btnMusicRecite.style.display = hasMR ? 'inline-block' : 'none';
      if (btnMusic) btnMusic.style.display = hasM ? 'inline-block' : 'none';

      const trackCount = [hasV, hasAi, hasMR, hasM].filter(Boolean).length;
      if (toggleGroup) toggleGroup.style.display = (trackCount > 1) ? 'flex' : 'none';

      if (hasM) switchAudioTrack('music', false);
      else if (hasMR) switchAudioTrack('music_recite', false);
      else if (hasAi) switchAudioTrack('ai_recite', false);
      else if (hasV) switchAudioTrack('voice', false);

      updateGalleryLyricsAndVideo(data, hasV || hasAi || hasMR || hasM);
    }

    function switchAudioTrack(type, autoPlay = false) {
      const data = EPISODES[currentIndex];
      if (!data) return;

      const audioPlayer = document.getElementById('audioPlayer');
      const audioSource = document.getElementById('audioSource');
      const titleSpan = document.getElementById('audioSectionTitle');
      const btnVoice = document.getElementById('btnPlayVoice');
      const btnAiRecite = document.getElementById('btnPlayAiRecite');
      const btnMusicRecite = document.getElementById('btnPlayMusicRecite');
      const btnMusic = document.getElementById('btnPlayMusic');

      if (audioPlayer) {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }
      [btnVoice, btnAiRecite, btnMusicRecite, btnMusic].forEach(b => { if (b) b.classList.remove('active'); });

      let rawSrc = '';
      if (type === 'voice') {
        if (btnVoice) btnVoice.classList.add('active');
        if (titleSpan) titleSpan.innerHTML = '<span>🎙️</span> 육성 시 낭송';
        rawSrc = data.voice || data.recite || data.audio || '';
      } else if (type === 'ai_recite' || type === 'recite') {
        if (btnAiRecite) btnAiRecite.classList.add('active');
        if (titleSpan) titleSpan.innerHTML = '<span>🤖</span> AI 시 낭송';
        rawSrc = data.aiRecite || data.recite || data.audio || '';
      } else if (type === 'music_recite') {
        if (btnMusicRecite) btnMusicRecite.classList.add('active');
        if (titleSpan) titleSpan.innerHTML = '<span>🎻</span> 음악 시 낭송';
        rawSrc = data.musicRecite || data.recite || data.music || data.audio || '';
      } else {
        if (btnMusic) btnMusic.classList.add('active');
        if (titleSpan) titleSpan.innerHTML = '<span>🎵</span> 노래 듣기';
        rawSrc = data.song || data.music || data.audio || '';
      }

      const targetSrc = resolveMediaUrl(rawSrc);
      if (targetSrc && audioPlayer) {
        audioPlayer.src = targetSrc;
        if (audioSource) audioSource.src = targetSrc;
        audioPlayer.load();
      }
      if (autoPlay && audioPlayer) {
        audioPlayer.play().catch(() => {});
      }
    }

    function updateGalleryLyricsAndVideo(data, hasAnyAudio) {
      const mediaBar = document.getElementById('galleryUnifiedMediaBar');
      const btnAudio = document.getElementById('btnGalleryAudioUnified');
      const btnVideo = document.getElementById('btnGalleryVideoUnified');
      const lyricsPanel = document.getElementById('galleryLyricsPanel');
      const lyricsText = document.getElementById('galleryLyricsText');
      const btnLyrics = document.getElementById('btnGalleryToggleLyrics');

      if (lyricsPanel) lyricsPanel.style.display = 'none';
      if (btnLyrics) {
        btnLyrics.textContent = '📜 가사 보기';
        btnLyrics.style.display = (data && data.lyrics && data.lyrics.trim()) ? 'inline-flex' : 'none';
      }
      if (lyricsText) lyricsText.textContent = (data && data.lyrics) ? data.lyrics.trim() : '';

      const hasA = Boolean(hasAnyAudio || (data && data.hasAudio));
      if (btnAudio) btnAudio.style.display = hasA ? 'inline-flex' : 'none';

      galleryAvailableVideos = { poem: null, song: null };
      const menuPoemV = document.getElementById('menuGalleryPoemVideo');
      const menuSongV = document.getElementById('menuGallerySongVideo');

      if (data && data.poemVideo) {
        galleryAvailableVideos.poem = { url: resolveMediaUrl(data.poemVideo), title: `「${data.title}」 시 낭송 영상` };
        if (menuPoemV) menuPoemV.style.display = 'flex';
      } else if (menuPoemV) {
        menuPoemV.style.display = 'none';
      }

      if (data && data.songVideo) {
        galleryAvailableVideos.song = { url: resolveMediaUrl(data.songVideo), title: `「${data.title}」 노래 뮤직비디오` };
        if (menuSongV) menuSongV.style.display = 'flex';
      } else if (menuSongV) {
        menuSongV.style.display = 'none';
      }

      const hasV = Boolean(galleryAvailableVideos.poem || galleryAvailableVideos.song);
      const vidWrap = document.getElementById('bottomVideoWrap');
      if (vidWrap) vidWrap.style.display = hasV ? 'inline-flex' : 'none';
      if (btnVideo) btnVideo.style.display = hasV ? 'inline-flex' : 'none';
      if (mediaBar) mediaBar.style.display = 'flex';
    }

    function toggleGalleryAudioPlayer() {
      const musicSec = document.getElementById('musicSection');
      if (!musicSec) return;
      if (musicSec.style.display === 'none') {
        musicSec.style.display = 'block';
      } else {
        closeAudioPlayer();
      }
    }

    function closeAudioPlayer() {
      const audioPlayer = document.getElementById('audioPlayer');
      const musicSec = document.getElementById('musicSection');
      if (audioPlayer) {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }
      if (musicSec) musicSec.style.display = 'none';
    }

    function toggleGalleryLyrics() {
      const panel = document.getElementById('galleryLyricsPanel');
      const btn = document.getElementById('btnGalleryToggleLyrics');
      if (!panel) return;
      if (panel.style.display === 'none') {
        panel.style.display = 'block';
        if (btn) btn.textContent = '✕ 가사 닫기';
      } else {
        panel.style.display = 'none';
        if (btn) btn.textContent = '📜 가사 보기';
      }
    }

    function toggleGalleryVideoMenu(event) {
      if (event) event.stopPropagation();
      const dropdown = document.getElementById('galleryVideoDropdown');
      if (!dropdown) return;
      const pV = galleryAvailableVideos.poem;
      const sV = galleryAvailableVideos.song;
      if (pV && !sV) { selectGalleryVideo('poem'); return; }
      if (!pV && sV) { selectGalleryVideo('song'); return; }
      dropdown.style.display = (dropdown.style.display === 'none') ? 'block' : 'none';
    }

    function selectGalleryVideo(type) {
      const dropdown = document.getElementById('galleryVideoDropdown');
      if (dropdown) dropdown.style.display = 'none';
      const target = galleryAvailableVideos[type];
      if (!target || !target.url) return;
      const audio = document.getElementById('audioPlayer');
      if (audio) audio.pause();
      openGlobalGalleryVideoModal(target.url, target.title);
    }

    document.addEventListener('click', () => {
      const dropdown = document.getElementById('galleryVideoDropdown');
      if (dropdown) dropdown.style.display = 'none';
    });

    function openGlobalGalleryVideoModal(videoUrl, title) {
      let modal = document.getElementById('galleryGlobalVideoModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'galleryGlobalVideoModal';
        modal.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:999999; backdrop-filter:blur(6px);';
        modal.innerHTML = `
          <div style="position:relative; width:92%; max-width:980px; background:#181412; border:1.5px solid #4A3B32; border-radius:14px; overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,0.65);">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background:#261F1A; border-bottom:1px solid #3D312A; color:#FFF;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-size:1.2rem;">🎬</span>
                <span id="galleryGlobalVideoTitle" style="font-weight:700; font-size:15px; color:#F5E8D3;">${title}</span>
              </div>
              <button onclick="closeGalleryVideoModal()" style="background:none; border:none; color:#D5C2B0; font-size:24px; cursor:pointer; padding:0 4px; line-height:1;">&times;</button>
            </div>
            <div style="position:relative; width:100%; height:0; padding-bottom:56.25%; background:#000;">
              <video id="galleryGlobalVideoElement" controls autoplay style="position:absolute; top:0; left:0; width:100%; height:100%; outline:none;"></video>
            </div>
          </div>`;
        document.body.appendChild(modal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeGalleryVideoModal(); });
      }
      document.getElementById('galleryGlobalVideoTitle').textContent = title;
      const videoEl = document.getElementById('galleryGlobalVideoElement');
      if (videoEl) {
        videoEl.src = videoUrl;
        videoEl.load();
        videoEl.play().catch(() => {});
      }
      modal.style.display = 'flex';
    }

    function closeGalleryVideoModal() {
      const modal = document.getElementById('galleryGlobalVideoModal');
      if (modal) {
        const videoEl = document.getElementById('galleryGlobalVideoElement');
        if (videoEl) { videoEl.pause(); videoEl.src = ''; }
        modal.style.display = 'none';
      }
    }

    // --------------------------------------------------------
    // 12. 프로젝트 전환 & 스튜디오 연동 & 초기화
    // --------------------------------------------------------
    async function initGalleryProjects() {
      const select = document.getElementById('selectGalleryProject');
      if (!select || !window.location.protocol.startsWith('http')) return;
      try {
        const res = await fetch('/api/projects');
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.projects) && data.projects.length > 0) {
            select.innerHTML = '';
            const currentPath = decodeURIComponent(window.location.pathname);
            data.projects.forEach(p => {
              const opt = document.createElement('option');
              opt.value = p.id || p.name.replace(/\s+/g, '_');
              opt.textContent = p.name;
              const safeName = p.name.replace(/\s+/g, '_');
              if (currentPath.includes(safeName) || (data.active_project && data.active_project.id === p.id && !currentPath.includes('projects/'))) {
                opt.selected = true;
              }
              select.appendChild(opt);
            });
          }
        }
      } catch (e) {}
    }

    async function onGalleryProjectChange(projId) {
      if (!projId) return;
      if (window.location.protocol.startsWith('http')) {
        await syncEpisodesFromBackend(projId);
        if (PROJECT_INFO && PROJECT_INFO.name) {
          document.title = `${PROJECT_INFO.name} — 그림과 노래가 되는 시`;
        }
        currentIndex = -1;
        currentSpreadPart = 1;
        currentSectionId = null;
        renderTOC();
        loadEpisode(0, 1);
      } else {
        window.location.href = `../${encodeURIComponent(projId)}/시화집_갤러리.html`;
      }
    }

    function checkStudioEnvironment() {
      const btn = document.getElementById('btnStudioLink');
      if (!btn) return;
      const isLocal = window.location.protocol === 'file:' ||
                      window.location.hostname === 'localhost' ||
                      window.location.hostname === '127.0.0.1';
      btn.style.display = isLocal ? 'inline-flex' : 'none';
    }

    let studioEditorWindow = null;
    function openStudioEditor() {
      const studioUrl = 'http://localhost:8000';
      if (window.opener && !window.opener.closed) {
        try { window.opener.focus(); return; } catch (e) {}
      }
      if (studioEditorWindow && !studioEditorWindow.closed) {
        try { studioEditorWindow.focus(); return; } catch (e) {}
      }
      studioEditorWindow = window.open(studioUrl, 'StoryBookStudio');
      if (studioEditorWindow) studioEditorWindow.focus();
    }

    async function init() {
      await syncEpisodesFromBackend();
      await initGalleryProjects();
      updateFontTagUI();
      renderTOC();
      loadEpisode(0, 1);
      checkStudioEnvironment();
      setTimeout(adjustSpreadScale, 50);

      const mainAudio = document.getElementById('audioPlayer');
      const errNotice = document.getElementById('audioErrorNotice');
      if (mainAudio && errNotice) {
        mainAudio.addEventListener('error', () => { errNotice.style.display = 'block'; });
        mainAudio.addEventListener('loadedmetadata', () => { errNotice.style.display = 'none'; });
      }

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowLeft') navigateSpreadStep(-1);
        if (e.key === 'ArrowRight') navigateSpreadStep(1);
      });

      const autoRefreshOnFocus = async () => {
        if (!window.location.protocol.startsWith('http')) return;
        const prevIdx = currentIndex;
        const prevPart = currentSpreadPart;
        const prevSec = currentSectionId;
        await syncEpisodesFromBackend();
        renderTOC();
        if (prevSec) renderMatterSection(prevSec);
        else if (EPISODES[prevIdx]) loadEpisode(prevIdx, prevPart);
      };
      window.addEventListener('focus', autoRefreshOnFocus);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) autoRefreshOnFocus();
      });
    }

    window.onload = init;
  
  // ==============================================================
  // 갤러리 공유 및 웹 배포 도구
  // ==============================================================
  function isLocalEnvironment() {
    const proto = window.location.protocol;
    const host = window.location.hostname;
    return proto === 'file:' || host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.') || host.startsWith('10.');
  }

  function shareGalleryLink() {
    if (isLocalEnvironment()) {
      alert("⚠️ 현재는 내 컴퓨터(로컬)에서만 열리는 주소입니다!\n\n" +
            "지인이나 가족, 카카오톡으로 공유하시려면,\n" +
            "스토리북 스튜디오 [출판 데이터] ➔ [웹 배포용 ZIP]을\n" +
            "무료 호스팅(Netlify 등)에 올려 공개 웹 주소를 만드신 후 공유해주세요. 😊");
      return;
    }

    const url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => {
        alert("🔗 갤러리 웹 주소가 복사되었습니다!\n\n가족, 친구, 카카오톡 등에 붙여넣어 나만의 시화집을 자랑해보세요:\n" + url);
      }).catch(() => fallbackCopy(url));
    } else {
      fallbackCopy(url);
    }
  }

  function fallbackCopy(text) {
    prompt("아래 갤러리 주소를 복사(Ctrl+C)하여 지인들에게 공유하세요:", text);
  }

  function shareToCommunityModal() {
    const projName = (typeof PROJECT_INFO !== "undefined" && PROJECT_INFO.name) ? PROJECT_INFO.name : "나의 시집";
    const currentUrl = window.location.href;
    const targetUrl = "/studio?open_inquiry=true&share_gallery=" + encodeURIComponent(currentUrl) + "&share_proj=" + encodeURIComponent(projName);
    
    // 만약 이미 스튜디오 하위에서 iframe이나 팝업으로 열린 경우
    if (window.opener && !window.opener.closed) {
      window.opener.location.href = targetUrl;
      window.opener.focus();
    } else {
      window.location.href = targetUrl;
    }
  }

  function exportWebGalleryZip() {
    const pid = (typeof PROJECT_INFO !== "undefined" && (PROJECT_INFO.id || PROJECT_INFO.name)) ? (PROJECT_INFO.id || PROJECT_INFO.name) : "";
    const url = "/api/projects/export_gallery_zip" + (pid ? ("?project_id=" + encodeURIComponent(pid)) : "");
    
    // 다운로드 트리거
    const a = document.createElement("a");
    a.href = url;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 100);

    // 친절한 웹 배포 가이드 모달 즉시 오픈
    openDeployGuideModal();
  }

  function openDeployGuideModal() {
    let modal = document.getElementById('deployGuideModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'deployGuideModal';
      modal.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(20,15,10,0.75); display:flex; justify-content:center; align-items:center; z-index:999999; backdrop-filter:blur(4px); padding:20px; box-sizing:border-box;';
      modal.innerHTML = `
        <div style="background:#FFFFFF; max-width:680px; width:100%; border-radius:14px; box-shadow:0 12px 36px rgba(0,0,0,0.25); border:1px solid #E8DFD5; overflow:hidden; display:flex; flex-direction:column; max-height:90vh; font-family:-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;">
          <!-- 모달 헤더 -->
          <div style="background:#FAF6F0; padding:16px 20px; border-bottom:1px solid #E8DFD5; display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:1.3rem;">🌐</span>
              <strong style="font-size:1.05rem; color:#4A3525;">온라인 시화 갤러리 웹 배포 가이드</strong>
            </div>
            <button onclick="closeDeployGuideModal()" style="background:none; border:none; font-size:24px; color:#8C7B70; cursor:pointer; line-height:1; padding:0 4px;">&times;</button>
          </div>

          <!-- 모달 바디 (스크롤 가능) -->
          <div style="padding:22px; overflow-y:auto; line-height:1.6; color:#2C221E; font-size:0.92rem;">
            <div style="background:#EBF7EE; border-left:4px solid #28A745; padding:12px 16px; border-radius:0 8px 8px 0; margin-bottom:18px; font-size:0.9rem; color:#155724;">
              ✅ <strong>독립 웹 갤러리 ZIP 패키지 다운로드가 시작되었습니다!</strong><br>
              다운로드된 압축 파일 안에는 <code>index.html</code>, <code>images/</code>, <code>music/</code>, <code>videos/</code> 및 시각적 안내서가 모두 포함되어 있습니다.
            </div>

            <h4 style="color:#8B5A2B; font-size:1.02rem; margin:0 0 10px 0; display:flex; align-items:center; gap:6px;">
              <span>🚀</span> [추천] Netlify Drop으로 10초 만에 무료 배포하기
            </h4>
            <div style="background:#FAF8F5; border:1px solid #EAE3D9; border-radius:10px; padding:14px 16px; margin-bottom:18px;">
              <ol style="margin:0; padding-left:20px; font-size:0.88rem; color:#4A3B32;">
                <li style="margin-bottom:6px;">다운로드된 <strong>ZIP 파일의 압축을 해제</strong>합니다. (index.html이 있는 폴더 확인)</li>
                <li style="margin-bottom:6px;">새 창으로 <a href="https://app.netlify.com/drop" target="_blank" rel="noopener" style="color:#C59B27; font-weight:700; text-decoration:underline;">app.netlify.com/drop</a> 에 접속합니다. (무료 로그인 권장)</li>
                <li style="margin-bottom:6px;">압축이 풀린 폴더 전체를 브라우저 점선 상자로 <strong>드래그 & 드롭</strong>합니다.</li>
                <li><strong>완성!</strong> 약 5초 뒤 전 세계 누구나 접속 가능한 영구 무료 웹 주소(예: <code>https://my-poem.netlify.app</code>)가 생성됩니다!</li>
              </ol>
              <div style="margin-top:12px; display:flex; gap:10px;">
                <a href="https://app.netlify.com/drop" target="_blank" rel="noopener" style="display:inline-block; background:#C59B27; color:#FFFFFF; text-decoration:none; font-weight:700; font-size:0.84rem; padding:8px 14px; border-radius:6px;">
                  🚀 Netlify Drop 사이트 바로가기 ↗
                </a>
              </div>
            </div>

            <h4 style="color:#4A3525; font-size:0.96rem; margin:0 0 8px 0; display:flex; align-items:center; gap:6px;">
              <span>🐙</span> GitHub Pages / Vercel 배포도 완벽 지원
            </h4>
            <p style="font-size:0.86rem; color:#6B5B52; margin-bottom:12px;">
              • <strong>GitHub Pages</strong>: 새 리포지토리를 만들고 압축 해제된 파일들을 루트에 올린 뒤, 저장소 Settings &gt; Pages에서 'main' 브랜치를 선택하시면 즉시 배포됩니다.<br>
              • <strong>ZIP 내부 가이드</strong>: 압축 해제 시 <code>배포가이드_클릭하여열기.html</code>과 <code>README_웹배포_안내.txt</code>가 동봉되어 있어 오프라인에서도 언제든 확인 가능합니다.
            </p>

            <div style="background:#F4EFEA; border-radius:8px; padding:10px 14px; font-size:0.84rem; color:#6B5038;">
              💬 <strong>소통방 연계 팁</strong>: 배포 후 발급받은 웹 주소를 복사하여 갤러리 상단 <strong>[💬 내 갤러리 구경 오세요]</strong> 버튼을 누르면 다른 작가님들에게 바로 자랑하고 의견을 나눌 수 있습니다!
            </div>
          </div>

          <!-- 모달 풋터 -->
          <div style="background:#FAF6F0; padding:12px 20px; border-top:1px solid #E8DFD5; display:flex; justify-content:flex-end; gap:8px;">
            <button onclick="closeDeployGuideModal()" style="background:#8B5A2B; color:#FFFFFF; border:none; padding:8px 18px; border-radius:6px; font-weight:600; font-size:0.88rem; cursor:pointer;">
              확인 (닫기)
            </button>
          </div>
        </div>

      document.body.appendChild(modal);
    }
    modal.style.display = 'flex';
  }

  function closeDeployGuideModal() {
    const modal = document.getElementById('deployGuideModal');
    if (modal) {
      modal.style.display = 'none';
    }
  }

</script>
